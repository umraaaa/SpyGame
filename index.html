<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>臥底遊戲</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<style>/* 關鍵樣式，避免載入 CSS 前的白閃 */
  body{margin:0;color:#fff;background:linear-gradient(140deg,#5b2ba8,#8b3fd6 30%,#d64f9e 65%,#f2784b);background-attachment:fixed;font-family:system-ui,sans-serif}
</style>
<script>
  // cache-bust：每次都抓最新的樣式與程式，避免不同裝置卡在舊版本看到不一樣的畫面
  var _v = '?v=' + Date.now();
  document.write('<link rel="stylesheet" href="style.css' + _v + '">');
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<header>
  <div class="logo">🕵️ 臥底遊戲</div>
  <div id="roomChip" class="chip hidden"></div>
  <button id="btnPause" class="iconBtn hidden">⏸️</button>
  <div class="vol"><button id="btnMute" class="muteBtn">🔊</button><input id="vol" type="range" min="0" max="1" step="0.01" value="1"></div>
</header>

<main>
  <!-- 首頁：開房 / 加入 -->
  <section id="scrHome" class="card home">
    <h1>🕵️ 臥底遊戲</h1>
    <p class="sub">找出拿到不一樣題目的那個人</p>
    <input id="inName" maxlength="12" placeholder="你的暱稱">

    <div class="setup">
      <div class="segGroup">
        <div class="segCap">內容</div>
        <div class="seg">
          <button id="modeSong" class="segBtn on">🎵 歌曲</button>
          <button id="modeWord" class="segBtn">✏️ 單詞</button>
        </div>
      </div>
      <div class="segGroup">
        <div class="segCap">表決方式</div>
        <div class="seg">
          <button id="voteMulti" class="segBtn on">🔁 多次投票</button>
          <button id="voteSingle" class="segBtn">1️⃣ 單次投票</button>
        </div>
      </div>
    </div>

    <button id="btnCreate" class="btn big">🎉 開新房間</button>
    <div class="or">－ 或 －</div>
    <div class="row">
      <input id="inCode" maxlength="4" placeholder="房號" style="text-transform:uppercase">
      <button id="btnJoin" class="btn">加入</button>
    </div>
  </section>

  <!-- 遊戲主畫面 -->
  <section id="scrGame" class="hidden">
    <nav class="tabs">
      <button id="tabStage" class="tab on">🎮 遊戲</button>
      <button id="tabSong" class="tab">📝 題庫</button>
    </nav>
    <div id="viewStage"></div>
    <div id="viewSong" class="hidden">
      <div class="card tipCard" id="tipCard"></div>
      <div class="panels">
        <div class="card panel" id="panelCiv" data-side="civ"><h3></h3><div class="pBody"></div></div>
        <div class="card panel" id="panelSpy" data-side="spy"><h3></h3><div class="pBody"></div></div>
      </div>
      <button id="btnAddPair" class="btn big">➕ 加入題庫</button>
      <div class="card"><h2>📝 我的題庫</h2><div id="queueList"><p class="dim">還沒有題目，上面編好一組後按「加入題庫」。</p></div></div>
    </div>
  </section>
</main>

<!-- 倒數遮罩 -->
<div id="countOverlay" class="hidden"><div id="countNum">3</div></div>

<!-- 確認視窗 -->
<div id="modal" class="hidden">
  <div class="card modalBox">
    <p id="modalText"></p>
    <div class="row end">
      <button id="modalCancel" class="btn ghost">取消</button>
      <button id="modalOk" class="btn">確定</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script>document.write('<scr' + 'ipt src="app.js' + _v + '"></scr' + 'ipt>');</script>
</body>
</html>
